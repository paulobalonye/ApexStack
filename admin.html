<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#000000">
  <title>ApexStack Cloud - Email Template Admin</title>
    <link rel="icon" type="image/svg+xml" href="images/favicon.svg">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">

  <!-- CodeMirror 6 via ESM -->
  <script type="module">
    import { EditorView, basicSetup } from 'https://esm.sh/codemirror@6.0.1';
    import { html } from 'https://esm.sh/@codemirror/lang-html@6.4.9';
    import { oneDark } from 'https://esm.sh/@codemirror/theme-one-dark@6.1.2';
    window.CM = { EditorView, basicSetup, html, oneDark };
    window.dispatchEvent(new Event('cm-ready'));
  </script>

  <!-- Admin Styles -->
  <link rel="stylesheet" href="css/admin.css">

  <style>
    /* ===== CSS RESET & BASE ===== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-primary: #000000;
      --bg-card: #111111;
      --bg-elevated: #1a1a1a;
      --bg-input: #0a0a0a;
      --accent: #b8e600;
      --accent-dim: rgba(184, 230, 0, 0.15);
      --accent-glow: rgba(184, 230, 0, 0.08);
      --text-primary: #ffffff;
      --text-secondary: #999999;
      --text-tertiary: #666666;
      --border: #222222;
      --border-hover: #333333;
      --danger: #ff4d4d;
      --success: #00e676;
      --warning: #ffab00;
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 16px;
      --radius-xl: 24px;
      --font-display: 'Plus Jakarta Sans', sans-serif;
      --font-body: 'Inter', sans-serif;
      --font-mono: 'IBM Plex Mono', monospace;
      --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
      --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    html { font-size: 16px; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }

    body {
      font-family: var(--font-body);
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    /* Grain texture overlay */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      z-index: 9999;
      pointer-events: none;
      opacity: 0.035;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
      background-repeat: repeat;
      background-size: 200px 200px;
    }

    /* ===== VIEW MANAGEMENT ===== */
    .view {
      display: none;
      opacity: 0;
      transform: translateY(12px);
      transition: opacity 0.5s var(--ease-out-expo), transform 0.5s var(--ease-out-expo);
    }
    .view.active {
      display: flex;
      flex-direction: column;
      opacity: 1;
      transform: translateY(0);
    }

    /* ===== SCROLLBAR ===== */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #555; }

    /* ===== UTILITY ===== */
    .hidden { display: none !important; }

    /* ===== BUTTONS ===== */
    button {
      font-family: var(--font-body);
      cursor: pointer;
      border: none;
      background: none;
      color: inherit;
      font-size: inherit;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 20px;
      border-radius: var(--radius-sm);
      font-weight: 600;
      font-size: 0.875rem;
      transition: all 0.25s var(--ease-out-expo);
      white-space: nowrap;
      position: relative;
      overflow: hidden;
    }
    .btn svg { width: 16px; height: 16px; flex-shrink: 0; }

    .btn-primary {
      background: var(--accent);
      color: #000;
    }
    .btn-primary:hover {
      background: #c8f520;
      transform: translateY(-1px);
      box-shadow: 0 4px 20px rgba(184, 230, 0, 0.25);
    }
    .btn-primary:active { transform: translateY(0); }

    .btn-secondary {
      background: var(--bg-elevated);
      color: var(--text-primary);
      border: 1px solid var(--border);
    }
    .btn-secondary:hover {
      border-color: var(--border-hover);
      background: #222;
      transform: translateY(-1px);
    }

    .btn-ghost {
      background: transparent;
      color: var(--text-secondary);
    }
    .btn-ghost:hover { color: var(--text-primary); background: rgba(255,255,255,0.05); }

    .btn-danger {
      background: transparent;
      color: var(--danger);
      border: 1px solid rgba(255, 77, 77, 0.25);
    }
    .btn-danger:hover {
      background: rgba(255, 77, 77, 0.1);
      border-color: rgba(255, 77, 77, 0.5);
      transform: translateY(-1px);
    }

    .btn-loader {
      width: 16px;
      height: 16px;
      border: 2px solid transparent;
      border-top-color: currentColor;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ===== INPUTS ===== */
    input[type="text"],
    input[type="password"],
    input[type="email"],
    input[type="search"] {
      font-family: var(--font-body);
      background: var(--bg-input);
      border: 1px solid var(--border);
      color: var(--text-primary);
      padding: 12px 16px;
      border-radius: var(--radius-sm);
      font-size: 0.9375rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      width: 100%;
    }
    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-dim);
    }
    input::placeholder { color: var(--text-tertiary); }

    /* ===== BADGES ===== */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 600;
      font-family: var(--font-mono);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .badge-accent {
      background: var(--accent-dim);
      color: var(--accent);
    }
    .badge-default {
      background: rgba(255,255,255,0.06);
      color: var(--text-secondary);
    }
    .badge-customized {
      background: rgba(0, 230, 118, 0.12);
      color: var(--success);
    }

    /* ================================================================
       LOGIN VIEW
       ================================================================ */
    #login-view {
      min-height: 100vh;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    /* Gradient mesh background */
    .login-mesh {
      position: absolute;
      inset: 0;
      z-index: 0;
      overflow: hidden;
    }
    .login-mesh::before {
      content: '';
      position: absolute;
      width: 800px;
      height: 800px;
      top: -200px;
      right: -200px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(184, 230, 0, 0.08) 0%, transparent 70%);
      animation: meshFloat 12s ease-in-out infinite alternate;
    }
    .login-mesh::after {
      content: '';
      position: absolute;
      width: 600px;
      height: 600px;
      bottom: -150px;
      left: -150px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(184, 230, 0, 0.05) 0%, transparent 70%);
      animation: meshFloat 10s ease-in-out infinite alternate-reverse;
    }
    @keyframes meshFloat {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(40px, -30px) scale(1.1); }
    }

    /* Subtle grid lines */
    .login-grid {
      position: absolute;
      inset: 0;
      z-index: 0;
      background-image:
        linear-gradient(rgba(184, 230, 0, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(184, 230, 0, 0.03) 1px, transparent 1px);
      background-size: 60px 60px;
      mask-image: radial-gradient(ellipse 60% 60% at 50% 50%, black 20%, transparent 70%);
      -webkit-mask-image: radial-gradient(ellipse 60% 60% at 50% 50%, black 20%, transparent 70%);
    }

    .login-card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 420px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      padding: 48px 40px;
      animation: cardReveal 0.8s var(--ease-out-expo) forwards;
      opacity: 0;
      transform: translateY(20px) scale(0.98);
    }
    @keyframes cardReveal {
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .login-logo {
      text-align: center;
      margin-bottom: 8px;
    }
    .login-logo .logo-text {
      font-family: var(--font-display);
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1;
    }
    .login-logo .logo-apex { color: #fff; }
    .login-logo .logo-stack { color: var(--accent); }

    .login-subtitle {
      text-align: center;
      color: var(--text-tertiary);
      font-size: 0.875rem;
      font-family: var(--font-mono);
      margin-bottom: 40px;
      letter-spacing: 0.03em;
    }

    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      font-size: 0.8125rem;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      font-family: var(--font-mono);
    }

    #login-btn {
      width: 100%;
      justify-content: center;
      padding: 14px 24px;
      font-size: 1rem;
      margin-top: 8px;
      border-radius: var(--radius-md);
      font-family: var(--font-display);
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .error-msg {
      background: rgba(255, 77, 77, 0.1);
      border: 1px solid rgba(255, 77, 77, 0.2);
      color: var(--danger);
      padding: 12px 16px;
      border-radius: var(--radius-sm);
      font-size: 0.875rem;
      margin-bottom: 20px;
      animation: errorShake 0.4s var(--ease-out-expo);
    }
    @keyframes errorShake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-6px); }
      40% { transform: translateX(6px); }
      60% { transform: translateX(-4px); }
      80% { transform: translateX(4px); }
    }

    .login-footer {
      text-align: center;
      margin-top: 32px;
      padding-top: 24px;
      border-top: 1px solid var(--border);
    }
    .login-footer a {
      color: var(--text-tertiary);
      font-size: 0.8125rem;
      text-decoration: none;
      transition: color 0.2s;
      font-family: var(--font-mono);
    }
    .login-footer a:hover { color: var(--accent); }
    .login-footer a svg { width: 12px; height: 12px; vertical-align: -1px; margin-left: 4px; }

    /* ================================================================
       DASHBOARD VIEW
       ================================================================ */
    #dashboard-view {
      min-height: 100vh;
      padding: 0;
    }

    /* Dashboard Header */
    .dash-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 40px;
      border-bottom: 1px solid var(--border);
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .dash-header-left {
      display: flex;
      align-items: center;
      gap: 20px;
    }
    .dash-header-logo {
      font-family: var(--font-display);
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      white-space: nowrap;
    }
    .dash-header-divider {
      width: 1px;
      height: 24px;
      background: var(--border);
    }
    .dash-header-title {
      font-family: var(--font-display);
      font-size: 1rem;
      font-weight: 600;
      color: var(--text-secondary);
    }

    .dash-header-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .admin-badge {
      background: var(--accent-dim);
      color: var(--accent);
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 600;
      font-family: var(--font-mono);
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    #logout-btn {
      color: var(--text-tertiary);
      font-size: 0.875rem;
      font-family: var(--font-mono);
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      border-radius: var(--radius-sm);
      transition: all 0.2s;
    }
    #logout-btn:hover { color: var(--danger); background: rgba(255, 77, 77, 0.08); }
    #logout-btn svg { width: 16px; height: 16px; }

    /* Dashboard Content */
    .dash-content {
      max-width: 1400px;
      margin: 0 auto;
      padding: 40px;
    }

    /* Stats Bar */
    .stats-bar {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      margin-bottom: 48px;
    }
    .stat-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 28px 28px 24px;
      position: relative;
      overflow: hidden;
      transition: transform 0.3s var(--ease-out-expo), border-color 0.3s;
      opacity: 0;
      transform: translateY(16px);
      animation: staggerReveal 0.6s var(--ease-out-expo) forwards;
    }
    .stat-card:nth-child(1) { animation-delay: 0.1s; }
    .stat-card:nth-child(2) { animation-delay: 0.2s; }
    .stat-card:nth-child(3) { animation-delay: 0.3s; }

    @keyframes staggerReveal {
      to { opacity: 1; transform: translateY(0); }
    }

    .stat-card:hover { transform: translateY(-3px); border-color: var(--border-hover); }

    .stat-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
    }
    .stat-card:nth-child(1)::before { background: linear-gradient(90deg, var(--accent), transparent); }
    .stat-card:nth-child(2)::before { background: linear-gradient(90deg, var(--success), transparent); }
    .stat-card:nth-child(3)::before { background: linear-gradient(90deg, var(--text-tertiary), transparent); }

    .stat-icon {
      width: 40px;
      height: 40px;
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
    }
    .stat-icon svg { width: 20px; height: 20px; }
    .stat-card:nth-child(1) .stat-icon { background: var(--accent-dim); color: var(--accent); }
    .stat-card:nth-child(2) .stat-icon { background: rgba(0, 230, 118, 0.12); color: var(--success); }
    .stat-card:nth-child(3) .stat-icon { background: rgba(255, 255, 255, 0.06); color: var(--text-tertiary); }

    .stat-label {
      font-size: 0.8125rem;
      font-family: var(--font-mono);
      color: var(--text-tertiary);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 8px;
    }
    .stat-value {
      font-family: var(--font-display);
      font-size: 2.5rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1;
    }

    /* Search & Filters */
    .toolbar {
      display: flex;
      flex-direction: column;
      gap: 20px;
      margin-bottom: 32px;
    }

    .search-wrapper {
      position: relative;
      max-width: 400px;
    }
    .search-wrapper svg {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      width: 18px;
      height: 18px;
      color: var(--text-tertiary);
      pointer-events: none;
    }
    #search-input {
      padding-left: 46px;
      background: var(--bg-card);
      border-radius: var(--radius-md);
    }

    .category-tabs {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .category-tabs button {
      padding: 8px 18px;
      border-radius: 999px;
      font-size: 0.8125rem;
      font-weight: 600;
      font-family: var(--font-body);
      color: var(--text-secondary);
      background: var(--bg-card);
      border: 1px solid var(--border);
      transition: all 0.25s var(--ease-out-expo);
    }
    .category-tabs button:hover {
      border-color: var(--border-hover);
      color: var(--text-primary);
    }
    .category-tabs button.active {
      background: var(--accent);
      color: #000;
      border-color: var(--accent);
    }

    /* Template Grid */
    .template-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
    }

    .template-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 24px;
      cursor: pointer;
      transition: all 0.3s var(--ease-out-expo);
      position: relative;
      overflow: hidden;
      opacity: 0;
      transform: translateY(12px);
      animation: staggerReveal 0.5s var(--ease-out-expo) forwards;
    }
    .template-card:hover {
      border-color: var(--accent);
      transform: translateY(-4px);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(184, 230, 0, 0.1);
    }

    .template-card-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    .template-card-icon {
      width: 44px;
      height: 44px;
      border-radius: var(--radius-md);
      background: var(--accent-dim);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent);
      flex-shrink: 0;
    }
    .template-card-icon svg { width: 22px; height: 22px; }

    .template-card-status {
      font-size: 0.6875rem;
      font-family: var(--font-mono);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 4px 8px;
      border-radius: 4px;
    }
    .template-card-status.customized { background: rgba(0,230,118,0.12); color: var(--success); }
    .template-card-status.default { background: rgba(255,255,255,0.06); color: var(--text-tertiary); }

    .template-card-name {
      font-family: var(--font-display);
      font-size: 1.0625rem;
      font-weight: 700;
      margin-bottom: 6px;
      letter-spacing: -0.01em;
    }
    .template-card-subject {
      font-size: 0.8125rem;
      color: var(--text-secondary);
      margin-bottom: 16px;
      line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .template-card-meta {
      display: flex;
      align-items: center;
      gap: 12px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
    }
    .template-card-category {
      font-size: 0.75rem;
      font-family: var(--font-mono);
      color: var(--accent);
      background: var(--accent-dim);
      padding: 3px 8px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .template-card-vars {
      font-size: 0.75rem;
      font-family: var(--font-mono);
      color: var(--text-tertiary);
    }

    /* Empty State */
    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 80px 20px;
    }
    .empty-state-icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 20px;
      border-radius: 50%;
      background: rgba(255,255,255,0.04);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-tertiary);
    }
    .empty-state-icon svg { width: 28px; height: 28px; }
    .empty-state-title {
      font-family: var(--font-display);
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 8px;
      color: var(--text-secondary);
    }
    .empty-state-text {
      color: var(--text-tertiary);
      font-size: 0.9375rem;
    }

    /* ================================================================
       EDITOR VIEW
       ================================================================ */
    #editor-view {
      height: 100vh;
    }

    .editor-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 24px;
      border-bottom: 1px solid var(--border);
      background: rgba(0, 0, 0, 0.9);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      gap: 16px;
      flex-shrink: 0;
    }

    .editor-header-left {
      display: flex;
      align-items: center;
      gap: 16px;
      min-width: 0;
    }

    #back-btn {
      width: 36px;
      height: 36px;
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-secondary);
      transition: all 0.2s;
      flex-shrink: 0;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
    }
    #back-btn:hover { color: var(--text-primary); border-color: var(--border-hover); }
    #back-btn svg { width: 18px; height: 18px; }

    .editor-title-group {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }
    #editor-title {
      font-family: var(--font-display);
      font-size: 1.0625rem;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      letter-spacing: -0.01em;
    }
    #editor-badges {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }

    .editor-header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    /* Subject Line Bar */
    .subject-bar {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 12px 24px;
      border-bottom: 1px solid var(--border);
      background: var(--bg-card);
      flex-shrink: 0;
    }
    .subject-label {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-tertiary);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      white-space: nowrap;
    }
    #subject-input {
      flex: 1;
      background: var(--bg-input);
      border-radius: var(--radius-sm);
      font-size: 0.9375rem;
      padding: 10px 14px;
    }

    /* Variable Chips */
    .chips-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 24px;
      border-bottom: 1px solid var(--border);
      background: rgba(17, 17, 17, 0.6);
      overflow-x: auto;
      flex-shrink: 0;
    }
    .chips-label {
      font-family: var(--font-mono);
      font-size: 0.6875rem;
      font-weight: 600;
      color: var(--text-tertiary);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      white-space: nowrap;
    }
    .variable-chip {
      display: inline-flex;
      align-items: center;
      padding: 5px 12px;
      background: rgba(184, 230, 0, 0.08);
      border: 1px solid rgba(184, 230, 0, 0.15);
      border-radius: 999px;
      font-family: var(--font-mono);
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--accent);
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .variable-chip:hover {
      background: rgba(184, 230, 0, 0.15);
      border-color: rgba(184, 230, 0, 0.3);
      transform: translateY(-1px);
    }

    /* Editor Body - Split Pane */
    .editor-body {
      display: flex;
      flex: 1;
      min-height: 0;
      overflow: hidden;
    }

    .editor-pane {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      overflow: hidden;
    }

    .pane-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      background: var(--bg-card);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .pane-header-label {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-tertiary);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .pane-header-label svg { width: 14px; height: 14px; }

    .pane-header-actions {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .preview-toggle {
      width: 32px;
      height: 32px;
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-tertiary);
      transition: all 0.2s;
    }
    .preview-toggle:hover { color: var(--text-primary); background: rgba(255,255,255,0.06); }
    .preview-toggle.active { color: var(--accent); background: var(--accent-dim); }
    .preview-toggle svg { width: 16px; height: 16px; }

    #codemirror-container {
      flex: 1;
      overflow: auto;
      background: var(--bg-input);
    }
    #codemirror-container .cm-editor { height: 100%; }
    #codemirror-container .cm-editor .cm-scroller { overflow: auto; }
    #codemirror-container .cm-editor.cm-focused { outline: none; }

    /* Split Handle */
    #split-handle {
      width: 5px;
      background: var(--border);
      cursor: col-resize;
      position: relative;
      flex-shrink: 0;
      transition: background 0.2s;
    }
    #split-handle:hover, #split-handle:active {
      background: var(--accent);
    }
    #split-handle::after {
      content: '';
      position: absolute;
      left: -4px;
      right: -4px;
      top: 0;
      bottom: 0;
    }

    /* Preview Pane */
    .preview-pane {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      overflow: hidden;
      background: #fff;
    }

    #preview-frame {
      flex: 1;
      width: 100%;
      border: none;
      background: #fff;
      transition: max-width 0.3s var(--ease-out-expo);
    }
    #preview-frame.mobile-view {
      max-width: 375px;
      margin: 0 auto;
      border-left: 1px solid var(--border);
      border-right: 1px solid var(--border);
    }

    /* ================================================================
       TOAST
       ================================================================ */
    #toast-container {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 10000;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .toast {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 20px;
      border-radius: var(--radius-md);
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      font-size: 0.875rem;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
      animation: toastIn 0.4s var(--ease-spring) forwards;
      backdrop-filter: blur(8px);
    }
    .toast svg { width: 18px; height: 18px; flex-shrink: 0; }
    .toast.success { border-color: rgba(0, 230, 118, 0.3); }
    .toast.success svg { color: var(--success); }
    .toast.error { border-color: rgba(255, 77, 77, 0.3); }
    .toast.error svg { color: var(--danger); }
    .toast.info { border-color: rgba(184, 230, 0, 0.3); }
    .toast.info svg { color: var(--accent); }

    @keyframes toastIn {
      from { opacity: 0; transform: translateY(16px) scale(0.95); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes toastOut {
      to { opacity: 0; transform: translateY(-8px) scale(0.95); }
    }

    /* ================================================================
       CONFIRM DIALOG
       ================================================================ */
    #confirm-overlay {
      position: fixed;
      inset: 0;
      z-index: 10001;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s, visibility 0.3s;
    }
    #confirm-overlay.visible {
      opacity: 1;
      visibility: visible;
    }

    .confirm-dialog {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      padding: 36px;
      max-width: 420px;
      width: 90%;
      transform: scale(0.95);
      transition: transform 0.3s var(--ease-spring);
    }
    #confirm-overlay.visible .confirm-dialog {
      transform: scale(1);
    }

    #confirm-title {
      font-family: var(--font-display);
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 8px;
      letter-spacing: -0.01em;
    }
    #confirm-message {
      color: var(--text-secondary);
      font-size: 0.9375rem;
      line-height: 1.6;
      margin-bottom: 28px;
    }
    .confirm-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }

    /* ================================================================
       RESPONSIVE
       ================================================================ */
    @media (max-width: 768px) {
      .dash-header { padding: 16px 20px; }
      .dash-content { padding: 24px 20px; }
      .stats-bar { grid-template-columns: 1fr; }
      .template-grid { grid-template-columns: 1fr; }
      .login-card { margin: 20px; padding: 32px 24px; }
      .editor-header { padding: 12px 16px; flex-wrap: wrap; }
      .editor-body { flex-direction: column; }
      #split-handle { width: auto; height: 5px; cursor: row-resize; }
    }
  </style>
</head>
<body>

  <!-- ============================================================
       LOGIN VIEW
       ============================================================ -->
  <div id="login-view" class="view active">
    <div class="login-mesh"></div>
    <div class="login-grid"></div>

    <div class="login-card">
      <div class="login-logo">
        <span class="logo-text">
          <span class="logo-apex">Apex</span><span class="logo-stack">Stack</span>
        </span>
      </div>
      <p class="login-subtitle">Email Template Admin</p>

      <div id="login-error" class="error-msg hidden"></div>

      <form id="login-form" autocomplete="off">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" placeholder="admin" autocomplete="username" required>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Enter password" autocomplete="current-password" required>
        </div>
        <button type="submit" id="login-btn" class="btn btn-primary">
          <span class="btn-text">Sign In</span>
          <span class="btn-loader hidden"></span>
        </button>
      </form>

      <div class="login-footer">
        <a href="https://apexstackcloud.com" target="_blank" rel="noopener">
          apexstackcloud.com
          <!-- External link icon -->
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
        </a>
      </div>
    </div>
  </div>

  <!-- ============================================================
       DASHBOARD VIEW
       ============================================================ -->
  <div id="dashboard-view" class="view">
    <!-- Header -->
    <header class="dash-header">
      <div class="dash-header-left">
        <div class="dash-header-logo">
          <span class="logo-apex">Apex</span><span class="logo-stack" style="color: var(--accent);">Stack</span>
        </div>
        <div class="dash-header-divider"></div>
        <span class="dash-header-title">Email Templates</span>
      </div>
      <div class="dash-header-right">
        <span class="admin-badge">Admin</span>
        <button id="logout-btn">
          <!-- Logout icon -->
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          Logout
        </button>
      </div>
    </header>

    <!-- Content -->
    <div class="dash-content">
      <!-- Stats Bar -->
      <div class="stats-bar">
        <div class="stat-card">
          <div class="stat-icon">
            <!-- Mail icon -->
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
          </div>
          <div class="stat-label">Total Templates</div>
          <div class="stat-value" id="stat-total">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon">
            <!-- Check circle icon -->
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
          </div>
          <div class="stat-label">Customized</div>
          <div class="stat-value" id="stat-customized">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon">
            <!-- Default/template icon -->
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="21" x2="9" y2="9"/></svg>
          </div>
          <div class="stat-label">Default</div>
          <div class="stat-value" id="stat-default">0</div>
        </div>
      </div>

      <!-- Toolbar -->
      <div class="toolbar">
        <!-- Search -->
        <div class="search-wrapper">
          <!-- Search icon -->
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="search" id="search-input" placeholder="Search templates...">
        </div>

        <!-- Category Tabs -->
        <div class="category-tabs" id="category-tabs">
          <button class="tab active" data-category="">All</button>
          <button class="tab" data-category="assessment">Assessment</button>
          <button class="tab" data-category="contact">Contact</button>
          <button class="tab" data-category="meeting">Meeting</button>
          <button class="tab" data-category="hiring">Hiring</button>
          <button class="tab" data-category="internal">Internal</button>
          <button class="tab" data-category="lifecycle">Lifecycle</button>
        </div>
      </div>

      <!-- Template Grid -->
      <div class="template-grid" id="template-grid">
        <!-- Template cards injected by JS -->
      </div>

      <!-- Empty State -->
      <div id="empty-state" class="empty-state hidden">
        <div class="empty-state-icon">
          <!-- Search icon -->
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        </div>
        <h3 class="empty-state-title">No templates found</h3>
        <p class="empty-state-text">Try adjusting your search or filter criteria.</p>
      </div>
    </div>
  </div>

  <!-- ============================================================
       EDITOR VIEW
       ============================================================ -->
  <div id="editor-view" class="view">
    <!-- Editor Header -->
    <header class="editor-header">
      <div class="editor-header-left">
        <button id="back-btn" title="Back to dashboard">
          <!-- Arrow left icon -->
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        </button>
        <div class="editor-title-group">
          <span id="editor-title">Template Name</span>
          <div id="editor-badges"></div>
        </div>
      </div>
      <div class="editor-header-actions">
        <button id="reset-btn" class="btn btn-danger" title="Reset to default">
          <!-- Reset icon -->
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
          Reset
        </button>
        <button id="send-test-btn" class="btn btn-secondary" title="Send test email">
          <!-- Send icon -->
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
          Send Test
        </button>
        <button id="save-btn" class="btn btn-primary" title="Save template">
          <!-- Save icon -->
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
          Save
        </button>
      </div>
    </header>

    <!-- Subject Line -->
    <div class="subject-bar">
      <span class="subject-label">Subject</span>
      <input type="text" id="subject-input" placeholder="Email subject line...">
    </div>

    <!-- Variable Chips -->
    <div class="chips-bar">
      <span class="chips-label">Variables</span>
      <div id="variable-chips">
        <!-- Variable chips injected by JS -->
      </div>
    </div>

    <!-- Split Editor -->
    <div class="editor-body">
      <!-- Code Editor Pane -->
      <div class="editor-pane" id="editor-pane">
        <div class="pane-header">
          <span class="pane-header-label">
            <!-- Code icon -->
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
            HTML Source
          </span>
        </div>
        <div id="codemirror-container"></div>
      </div>

      <!-- Split Handle -->
      <div id="split-handle"></div>

      <!-- Preview Pane -->
      <div class="preview-pane" id="preview-pane">
        <div class="pane-header">
          <span class="pane-header-label">
            <!-- Eye icon -->
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            Preview
          </span>
          <div class="pane-header-actions">
            <button id="preview-desktop" class="preview-toggle active" title="Desktop preview">
              <!-- Monitor icon -->
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
            </button>
            <button id="preview-mobile" class="preview-toggle" title="Mobile preview">
              <!-- Smartphone icon -->
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="2" ry="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg>
            </button>
            <button id="refresh-preview" class="preview-toggle" title="Refresh preview">
              <!-- Refresh icon -->
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
            </button>
          </div>
        </div>
        <iframe id="preview-frame" sandbox="allow-same-origin"></iframe>
      </div>
    </div>
  </div>

  <!-- ============================================================
       TOAST CONTAINER
       ============================================================ -->
  <div id="toast-container"></div>

  <!-- ============================================================
       CONFIRM DIALOG
       ============================================================ -->
  <div id="confirm-overlay">
    <div class="confirm-dialog">
      <h3 id="confirm-title">Confirm Action</h3>
      <p id="confirm-message">Are you sure you want to proceed?</p>
      <div class="confirm-actions">
        <button id="confirm-cancel" class="btn btn-secondary">Cancel</button>
        <button id="confirm-ok" class="btn btn-primary">Confirm</button>
      </div>
    </div>
  </div>

  <!-- Admin JS -->
  <script src="js/admin.js"></script>
</body>
</html>
